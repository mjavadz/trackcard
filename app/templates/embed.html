<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ track.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-[#0B0D11] text-white p-3 flex flex-col justify-between h-screen overflow-hidden">
  
  <div class="flex items-center gap-3">
    <img src="{{ track.cover_url }}" alt="{{ track.title }}" class="w-14 h-14 rounded-xl object-cover shrink-0 border border-white/10">
    <div class="min-w-0 flex-1">
      <div class="flex items-center justify-between gap-1">
        <h3 class="font-extrabold text-sm truncate text-white">{{ track.title }}</h3>
        <span class="text-[10px] text-orange-400 font-bold bg-orange-500/10 px-2 py-0.5 rounded-full shrink-0">🔥 <span id="counter">{{ track.stats.total_plays }}</span></span>
      </div>
      <p class="text-xs text-slate-400 truncate mt-0.5">{{ track.artist }}</p>
    </div>
  </div>

  <div class="space-y-1.5 my-auto">
    <audio id="audioElement" src="{{ audio_stream_url }}" preload="metadata"></audio>
    <div class="flex items-center gap-3">
      <button id="playBtn" class="w-10 h-10 rounded-full bg-[#1DB954] text-black font-black flex items-center justify-center shrink-0 hover:scale-105 active:scale-95 transition-all">
        <span id="icon" class="text-base pl-0.5">▶</span>
      </button>
      <div class="flex-1 space-y-1">
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden cursor-pointer" id="pBarContainer">
          <div id="pBar" class="bg-[#1DB954] h-full w-0 rounded-full"></div>
        </div>
        <div class="flex justify-between text-[10px] font-mono text-slate-500" dir="ltr">
          <span id="cur">0:00</span>
          <span id="dur">0:30</span>
        </div>
      </div>
    </div>
  </div>

  <div class="flex items-center justify-between text-[11px] text-slate-500 border-t border-white/5 pt-2">
    <span>TrackCard Player</span>
    <a href="{{ track.spotify_url }}" target="_blank" class="text-[#1DB954] font-bold">اسپاتیفای ➔</a>
  </div>

  <script>
    const a = document.getElementById('audioElement');
    const btn = document.getElementById('playBtn');
    const icon = document.getElementById('icon');
    const pBar = document.getElementById('pBar');
    const cur = document.getElementById('cur');
    const dur = document.getElementById('dur');
    let counted = false;

    btn.addEventListener('click', () => {
      if (a.paused) {
        a.play();
        icon.textContent = '❚❚';
        if (!counted) {
          fetch('/api/track/{{ track.id }}/play', { method: 'POST' })
            .then(r => r.json()).then(d => {
              if (d.total_plays) document.getElementById('counter').textContent = d.total_plays;
            });
          counted = true;
        }
      } else {
        a.pause();
        icon.textContent = '▶';
      }
    });

    a.addEventListener('timeupdate', () => {
      if (!a.duration) return;
      pBar.style.width = ((a.currentTime / a.duration) * 100) + '%';
      cur.textContent = fmt(a.currentTime);
    });

    a.addEventListener('loadedmetadata', () => dur.textContent = fmt(a.duration));
    a.addEventListener('ended', () => { icon.textContent = '▶'; pBar.style.width = '0%'; });

    function fmt(s) {
      if (isNaN(s)) return '0:00';
      const m = Math.floor(s / 60); const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }
  </script>
</body>
</html>
